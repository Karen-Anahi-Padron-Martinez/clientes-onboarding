spring.application.name=onboarding-clientes-test

# H2 In-Memory DB for automated integration tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

spring.sql.init.mode=never

# PuntoRed Mock AES Keys for Test Context
puntored.aes-key=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
puntored.aes-iv=MDEyMzQ1Njc4OWFiY2RlZg==

# Brevo Mock Config for Test Context
brevo.api-key=xkeysib-mock-api-key-for-tests
brevo.sender-email=notificaciones@bancodigital.com
brevo.sender-name=Banco Digital
brevo.base-url=https://api.brevo.com


# Sin tareas programadas ni llamadas reales a PuntoRed en pruebas
puntored.scheduler-enabled=false

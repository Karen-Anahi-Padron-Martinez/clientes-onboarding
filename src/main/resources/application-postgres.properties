spring.application.name=onboarding-clientes
server.port=${PORT:8081}

# Conexión JDBC a PostgreSQL Local
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/onboarding}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Dialecto JPA e Hibernate para PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Desactivar consola H2 cuando se utiliza PostgreSQL
spring.h2.console.enabled=false

# Seguridad en Errores de Servidor
server.error.include-stacktrace=never
server.error.include-message=never

# Deserialización Jackson estricta
spring.jackson.deserialization.fail-on-unknown-properties=true

# Configuración de Inactividad de Sesión y Biometría
app.seguridad.inactividad-segundos=5

# Documentación Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Logging
logging.level.com.kapm.onboarding_clientes=INFO
logging.level.org.hibernate.SQL=INFO

spring.application.name=onboarding-clientes
server.port=${PORT:8081}

# Conexión JDBC a Base de Datos PostgreSQL mediante variables de entorno seguras
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/onboarding}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JPA & Hibernate General (recrea las tablas con el nuevo esquema relacional y catálogos)
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.sql.init.mode=never

# Seguridad en Errores de Servidor (Ocultar stacktrace y mensaje interno al cliente)
server.error.include-stacktrace=never
server.error.include-message=never

# Deserialización Jackson estricta: rechaza campos desconocidos / no modificables
spring.jackson.deserialization.fail-on-unknown-properties=true

# Configuración de Inactividad de Sesión y Biometría
app.seguridad.inactividad-segundos=5

# Documentación Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Logging en nivel INFO
logging.level.com.kapm.onboarding_clientes=INFO
logging.level.org.hibernate.SQL=INFO

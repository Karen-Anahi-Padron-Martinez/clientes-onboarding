spring.application.name=onboarding-clientes

# Carga opcional del archivo .env de la raíz (desarrollo local). En Render/Docker las variables
# llegan como variables de entorno reales, que tienen prioridad sobre este archivo.
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8081}

# Conexión JDBC a Base de Datos PostgreSQL mediante variables de entorno seguras
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/onboarding}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JPA & Hibernate General
# NUNCA 'create' fuera de desarrollo: borraría saldos y pagos PENDIENTE, haciendo imposible la conciliación
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.sql.init.mode=never

# Seguridad en Errores de Servidor (Ocultar stacktrace y mensaje interno al cliente)
server.error.include-stacktrace=never
server.error.include-message=never

# Deserialización Jackson estricta: rechaza campos desconocidos / no modificables
spring.jackson.deserialization.fail-on-unknown-properties=true

# Configuración de Inactividad de Sesión y Biometría
app.seguridad.inactividad-segundos=5

# Documentación Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}

# Logging en nivel INFO
logging.level.com.kapm.onboarding_clientes=INFO
logging.level.org.hibernate.SQL=INFO

# =========================================================================
# Integración API PuntoRed (GestoPago) - Pagos de Servicios
# Todas las propiedades se configuran mediante variables de entorno seguras
# =========================================================================
puntored.base-url=${PUNTORED_BASE_URL:https://gestopago.portalventas.net}
puntored.authorization-url=${PUNTORED_AUTH_URL:https://gestopago.portalventas.net/auth}
puntored.auth-path=${PUNTORED_AUTH_PATH:/sistema/app/jwt-gp/authenticate/}
puntored.id-distribuidor=${PUNTORED_ID_DISTRIBUIDOR:}
puntored.codigo-dispositivo=${PUNTORED_CODIGO_DISPOSITIVO:}
puntored.usuario=${PUNTORED_USUARIO:}
puntored.password=${PUNTORED_PASSWORD:}
puntored.unidad=${PUNTORED_UNIDAD:}
puntored.zona-horaria=${PUNTORED_ZONA_HORARIA:America/Mexico_City}
puntored.aes-key=${PUNTORED_AES_KEY:}
puntored.aes-iv=${PUNTORED_AES_IV:}
puntored.connect-timeout=${PUNTORED_CONNECT_TIMEOUT:5000}
puntored.read-timeout=${PUNTORED_READ_TIMEOUT:70000}
puntored.api-key=${PUNTORED_API_KEY:}
puntored.monto-minimo-operacion=${PUNTORED_MONTO_MINIMO:1.00}
puntored.monto-maximo-operacion=${PUNTORED_MONTO_MAXIMO:5000.00}
puntored.minutos-antes-de-verificar=${PUNTORED_MINUTOS_ANTES_VERIFICAR:2}
puntored.minutos-ventana-reenvio-recarga=${PUNTORED_VENTANA_REENVIO_RECARGA:10}
puntored.minutos-ventana-reenvio-servicio=${PUNTORED_VENTANA_REENVIO_SERVICIO:1380}
puntored.max-intentos-verificacion=${PUNTORED_MAX_INTENTOS_VERIFICACION:5}
puntored.conciliacion-intervalo-ms=${PUNTORED_CONCILIACION_INTERVALO_MS:120000}
puntored.catalogo-sync-cron=${PUNTORED_CATALOGO_CRON:0 0 4 * * *}
puntored.catalogo-limite-diario=${PUNTORED_CATALOGO_LIMITE_DIARIO:3}
puntored.catalogo-horas-entre-sincronizaciones=${PUNTORED_CATALOGO_HORAS_ENTRE_SYNC:20}
puntored.scheduler-enabled=${PUNTORED_SCHEDULER_ENABLED:true}

# Administrador HTTP Basic (solo por variables de entorno; sin valor => administración cerrada)
app.security.admin-user=${ADMIN_USER:}
app.security.admin-password=${ADMIN_PASSWORD:}

# JWT de sesión de clientes: secreto Base64 >= 32 bytes (sin valor => llave efímera solo para desarrollo)
app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.expiracion-minutos=${JWT_EXPIRACION_MINUTOS:15}

# Orígenes permitidos por CORS (separados por coma)
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081}

# =========================================================================
# Integración Brevo - Correo Transaccional (API REST)
# =========================================================================
brevo.api-key=${BREVO_API_KEY:}
brevo.sender-email=${BREVO_SENDER_EMAIL:}
brevo.sender-name=${BREVO_SENDER_NAME:Banco Digital}
brevo.base-url=${BREVO_BASE_URL:https://api.brevo.com}
brevo.connect-timeout=${BREVO_CONNECT_TIMEOUT:5000}
brevo.read-timeout=${BREVO_READ_TIMEOUT:15000}

